<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSMS Hub - Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .admin-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            margin-bottom: 25px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #334155;
            font-size: 0.9rem;
        }
        th { background: #0f172a; color: var(--accent); }
        .btn-danger {
            background: #ef4444;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            width: auto;
        }
        .btn-nav {
            background: #10b981;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
        }
        .badge-success { background: #065f46; color: #34d399; }
        .badge-warning { background: #78350f; color: #fbbf24; }
    </style>
</head>
<body>

    <div class="admin-container">
        <!-- Header -->
        <div class="header-bar">
            <div>
                <h2 style="margin: 0; color: var(--accent);">Admin Panel - GSMS Hub</h2>
                <small id="adminNameDisplay" style="color: #94a3b8;"></small>
            </div>
            <div>
                <a href="index.html" class="btn-nav">🚀 Nenda Workspace</a>
                <button id="logoutBtn" style="width: auto; margin-left: 10px; background: #64748b; color: white;">Logout</button>
            </div>
        </div>

        <div class="grid-2">
            <!-- Form ya Kusajili Member Mpya -->
            <div style="background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid #334155;">
                <h3 style="margin-top: 0;">Sajili Member Mpya</h3>
                <p style="font-size: 0.8rem; color: #94a3b8;">Default Password itakuwa: <code>123456</code></p>
                
                <form id="addMemberForm">
                    <label style="font-size: 0.85rem;">Jina Bufe:</label>
                    <input type="text" id="memberName" placeholder="Mf. Ally Mna Ally" required>

                    <label style="font-size: 0.85rem;">Barua Pepe (Email):</label>
                    <input type="email" id="memberEmail" placeholder="mwanachama@gsms.com" required>

                    <label style="font-size: 0.85rem;">Reg No / Namba ya Usajili:</label>
                    <input type="text" id="memberRegNo" placeholder="Mf. GSMS/2026/001" required>

                    <button type="submit">Sajili Member</button>
                </form>
            </div>

            <!-- Table ya Members Waliopo -->
            <div style="background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid #334155;">
                <h3 style="margin-top: 0;">Orodha ya Watumiaji</h3>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Reg No / Email</th>
                                <th>Jina</th>
                                <th>Role</th>
                                <th>Pass Reset?</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="membersTableBody">
                            <tr><td colspan="5" style="text-align: center;">Inapakia watumiaji...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { requireAuth, logout } from './js/auth.js';
        import { registerUser, getAllMembers, deleteUser } from './js/db.js';

        document.addEventListener('DOMContentLoaded', async () => {
            // Guard: Hakikisha aliyelogin ni Admin
            const user = requireAuth();
            if (!user || user.role !== 'admin') {
                alert('Huna ruhusa ya kufungua ukurasa huu!');
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('adminNameDisplay').textContent = `Logged in as: ${user.full_name} (${user.reg_no})`;

            // Logout Event
            document.getElementById('logoutBtn').addEventListener('click', logout);

            // Load Members Table
            await loadMembers();

            // Form Submit Event
            const addMemberForm = document.getElementById('addMemberForm');
            addMemberForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const newMember = {
                    full_name: document.getElementById('memberName').value,
                    email: document.getElementById('memberEmail').value,
                    reg_no: document.getElementById('memberRegNo').value,
                    password: '123456', // Default password
                    role: 'member',
                    is_password_changed: false
                };

                try {
                    await registerUser(newMember);
                    alert(`Member ${newMember.full_name} amesajiliwa! Password yake ni 123456.`);
                    addMemberForm.reset();
                    await loadMembers();
                } catch (err) {
                    alert('Imefeli kusajili member: ' + err.message);
                }
            });
        });

        async function loadMembers() {
            const tbody = document.getElementById('membersTableBody');
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Inapakia watumiaji...</td></tr>';

            try {
                const members = await getAllMembers();
                tbody.innerHTML = '';

                members.forEach(m => {
                    const tr = document.createElement('tr');
                    const passStatus = m.is_password_changed 
                        ? '<span class="badge badge-success">Imebadilishwa</span>' 
                        : '<span class="badge badge-warning">Default (123456)</span>';

                    tr.innerHTML = `
                        <td><b>${m.reg_no}</b><br><small style="color:#94a3b8">${m.email}</small></td>
                        <td>${m.full_name}</td>
                        <td><span style="color: ${m.role === 'admin' ? '#38bdf8' : '#cbd5e1'}">${m.role.toUpperCase()}</span></td>
                        <td>${passStatus}</td>
                        <td>
                            ${m.role !== 'admin' 
                                ? `<button class="btn-danger" data-id="${m.id}">Futa</button>` 
                                : '<small style="color:#64748b">Admin</small>'}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                // Attach Delete Event
                document.querySelectorAll('.btn-danger').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.target.getAttribute('data-id');
                        if (confirm('Je, una uhakika unataka kufuta member huyu?')) {
                            try {
                                await deleteUser(id);
                                await loadMembers();
                            } catch (err) {
                                alert('Imefeli kufuta: ' + err.message);
                            }
                        }
                    });
                });

            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="5" style="color: red;">Error: ${err.message}</td></tr>`;
            }
        }
    </script>
</body>
</html>
