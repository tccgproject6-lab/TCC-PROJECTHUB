<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSMS Hub - Ingia</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Supabase CDN (Lazima iwe ya kwanza) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="card">
        <h2 style="text-align: center; color: var(--accent); margin-bottom: 5px;">GSMS Hub</h2>
        <hr style="border-color: var(--border-color); margin-bottom: 20px;">

        <!-- LOGIN FORM -->
        <div id="loginSection">
            <h3 style="margin-top: 0;">Ingia Kwenye Mfumo</h3>
            <form id="loginForm">
                <label>Email au Reg No:</label>
                <input type="text" id="identifier" placeholder="Email au Reg No" required>

                <label>Nenosiri (Password):</label>
                <input type="password" id="password" placeholder="Nenosiri" required>

                <button type="submit" style="margin-top: 10px;">Ingia (Login)</button>
            </form>
        </div>
    </div>

    <!-- SCRIPT ZA LOGIC YA DIRECT SUPABASE LOGIN -->
    <script>
        // 1. Supabase Initialization (Inatumia jina gsmsSupabase kuzuia mgongano)
        const SUPABASE_URL = 'https://exejmvckurtbdtcpjvxn.supabase.co';
        const SUPABASE_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4ZWptdmNrdXJ0YmR0Y3BqdnhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MjY0ODksImV4cCI6MjEwMjMwMjQ4OX0.nY1Xmb6gTi_MkVU8MSEd-tiz_hzuO8gPeOyapXGhsD8';

        // Kutengeneza client rasmi
        const gsmsSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 2. Handle Login Form Submit
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const identifier = document.getElementById('identifier').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                // Query moja kwa moja bila kupita njia ndefu
                const { data, error } = await gsmsSupabase
                    .from('users')
                    .select('*')
                    .or(`email.eq.${identifier},reg_no.eq.${identifier}`)
                    .eq('password', password);

                if (error) {
                    throw error;
                }

                if (!data || data.length === 0) {
                    alert('Taarifa ulizoingiza (Reg No/Email au Password) si sahihi!');
                    return;
                }

                const user = data[0];

                // Hifadhi user kwenye localStorage
                localStorage.setItem('currentUser', JSON.stringify(user));

                // Elekeza ukurasa kulingana na Role
                if (user.role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'index.html';
                }

            } catch (err) {
                alert('Imefeli kuingia: ' + err.message);
            }
        });
    </script>
</body>
</html>
